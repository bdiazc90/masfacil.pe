name: masfacil.pe · observar histórico

# Observa DESDE FUERA lo que ya sirve producción y lo archiva. Deliberadamente
# separado del workflow de precios: sin `needs`, sin dependencia inversa, con su
# propia cola y su propio environment. Que este falle no puede impedir publicar
# precios, actualizar GPS ni hacer rollback del sitio.

on:
  schedule:
    - cron: '37 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      summary_only:
        description: Reconstruir el resumen desde las observaciones guardadas, sin observar la fuente
        required: false
        type: boolean
        default: false
  # Tras una publicación real. El disparo NO prueba por sí solo que hubo deploy:
  # el observador siempre descarga y valida contra el origen público.
  workflow_run:
    workflows: ['masfacil.pe · refresh and deploy public PWA']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Escritor único del resumen. Sin cancelación: una corrida atrasada hace cola y
# sus guardas deciden si escribe, en vez de morir a mitad de una subida.
concurrency:
  group: masfacil-history-writer
  cancel-in-progress: false

jobs:
  observe:
    # Cuatro puertas para el disparo encadenado. El workflow de precios corre
    # también en PRs, así que sin ellas un PR de un fork podría provocar una
    # corrida con credenciales de escritura delante.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    # Proceso pequeño: descarga ~500 KB, sube JSON y reconstruye 30 días.
    timeout-minutes: 3
    # El environment es el del bucket compartido: cualquier utilitario que
    # escriba bajo datos.masfacil.pe usa este mismo y aporta su propio prefijo.
    environment: datos-production
    env:
      # Origen canónico; si falta, cae al pages.dev del proyecto.
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      # Almacén S3 compartido (hoy Neon Object Storage): endpoint, región y
      # bucket son variables; la llave, secreto. El prefijo `gasolina/` es del código.
      DATOS_S3_ENDPOINT: ${{ vars.DATOS_S3_ENDPOINT }}
      DATOS_S3_REGION: ${{ vars.DATOS_S3_REGION }}
      DATOS_S3_BUCKET: ${{ vars.DATOS_S3_BUCKET }}
      DATOS_S3_ACCESS_KEY_ID: ${{ secrets.DATOS_S3_ACCESS_KEY_ID }}
      DATOS_S3_SECRET_ACCESS_KEY: ${{ secrets.DATOS_S3_SECRET_ACCESS_KEY }}
    steps:
      # Siempre `main`, nunca el ref de la corrida que disparó: no se ejecuta
      # código ni se consumen artefactos que controle un PR.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.3.4
          run_install: false
      # `aws4fetch` no tiene dependencias ni scripts de instalación, así que
      # `--ignore-scripts` es gratis y cierra el vector igualmente.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Rechazar configuración de histórico incompleta
        run: |
          test -n "$DATOS_S3_ENDPOINT"
          test -n "$DATOS_S3_REGION"
          test -n "$DATOS_S3_BUCKET"
          test -n "$DATOS_S3_ACCESS_KEY_ID"
          test -n "$DATOS_S3_SECRET_ACCESS_KEY"

      - name: Observar y reconstruir el resumen
        env:
          SUMMARY_ONLY: ${{ inputs.summary_only && '1' || '0' }}
        run: node scripts/observe-history.mjs
