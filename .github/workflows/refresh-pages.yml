name: masfacil.pe · refresh and deploy public PWA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      force_project:
        description: Reproyectar el snapshot activo aunque los datos no hayan cambiado (para cambios de contrato, de catálogo o de código de proyección)
        required: false
        type: boolean
        default: false
      deploy_shell:
        description: Volver a publicar el shell reusando el bundle de datos ya publicado (sin proyectar ni descargar)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: masfacil-pages-refresh-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - run: npm run audit
      - run: node scripts/audit-publication.mjs --treeish HEAD --strict-history

  refresh_and_deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pages-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      # Origen público canónico (https://masfacil.pe). Si falta, cae al pages.dev del proyecto.
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      BOOTSTRAP_SEED_B64: ${{ secrets.BOOTSTRAP_SEED_B64 }}
      COMMERCIAL_IDENTITY_B64: ${{ secrets.COMMERCIAL_IDENTITY_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - name: Rechazar configuración incompleta
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "$BOOTSTRAP_SEED_B64"
      - name: Recuperar el bundle público ya verificado (~500 KB)
        run: npm run fetch:live -- "${PUBLIC_ORIGIN:-https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev}"
      - name: Instalar bootstrap privado mínimo
        run: npm run seed:install -- --target "$RUNNER_TEMP/seed-reference"
      - name: Instalar identidad comercial verificada
        if: env.COMMERCIAL_IDENTITY_B64 != ''
        run: npm run identity:install
      - name: Calcular cambio de shell
        id: shell
        env:
          DEPLOY_SHELL: ${{ inputs.deploy_shell && '1' || '0' }}
        run: |
          # Shell = solo web/ (sin web/data). Si el push toca además código de
          # proyección, el bundle publicado podría no corresponder al shell nuevo:
          # no se despliega solo y se pide force_project.
          changed=0
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! git diff --quiet HEAD^ HEAD -- web ':!web/data'; then
              if git diff --quiet HEAD^ HEAD -- pipeline app scripts bootstrap package.json; then
                changed=1
              else
                echo "::notice::El push toca web/ y también código fuera de web/; no se despliega el shell solo. Publica con force_project=true (o deploy_shell=true si lo de fuera no afecta la proyección)."
              fi
            fi
          elif [ "$DEPLOY_SHELL" = "1" ]; then
            changed=1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Restaurar el snapshot activo entre corridas
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.3
        with:
          path: .local-cache/snapshots
          key: snapshots-${{ hashFiles('bootstrap/seed.manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            snapshots-${{ hashFiles('bootstrap/seed.manifest.json') }}-
      - name: Refrescar, proyectar y verificar si corresponde
        id: prepare
        env:
          REFRESH_STATE_PATH: ${{ github.workspace }}/web/data/gasolina/refresh-state.json
          REFERENCE_MINIMIZED_ROOT: ${{ runner.temp }}/seed-reference
          SHELL_CHANGED: ${{ steps.shell.outputs.changed }}
          FORCE_PROJECT: ${{ inputs.force_project && '1' || '0' }}
          REFRESH_RESULT: ${{ runner.temp }}/refresh-result.json
        run: |
          set +e
          npm run publish
          status=$?
          node --input-type=module -e 'import fs from "node:fs"; const result=JSON.parse(fs.readFileSync(process.env.REFRESH_RESULT,"utf8")); console.log(`refresh=${result.refresh.status}; action=${result.decision.action}`); fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${result.decision.deploy}\n`);'
          exit "$status"
      - name: Direct Upload a Cloudflare Pages
        if: steps.prepare.outputs.deploy == 'true'
        run: npx --yes wrangler@4.31.0 pages deploy web --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
