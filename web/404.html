<head>

  <meta name="color-scheme" content="light dark">

  <title>Página no encontrada · masfacil.pe</title>

  <link rel="stylesheet" href="/styles.css">

<body>
  <!-- Página de error de Cloudflare Pages: al existir, ninguna ruta desconocida
       vuelve a servir la portada con 200. Solo clases de styles.css y un módulo
       con src: la CSP del sitio no admite estilos ni scripts en línea. -->
  <div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
  <a class="skip-link" href="#main">Ir al contenido</a>
  <main id="main" tabindex="-1" class="app-shell">
    <div class="glass">
      <header class="appbar">
        <a class="brand" href="/" aria-label="masfacil.pe, inicio"><img class="brand__logo" src="/icons/logo.svg" alt="" width="28" height="29">masfacil<em>.pe</em></a>
      </header>
      <section class="screen-flow start-step" aria-labelledby="not-found-title">
        <h1 id="not-found-title">No encontramos esta página</h1>
        <p class="lede">La dirección no existe o cambió. Los precios de gasolina siguen en la portada.</p>
        <a class="button button--primary" href="/">Ir a la portada</a>
        <a class="button--text" href="/combustibles/gasolina/historial">Ver el histórico de precios</a>
        <p class="hint">Error 404</p>
      </section>
    </div>
  </main>
  <footer class="firma">Hecho con amor para el Perú, por <a href="https://brunodiaz.dev" target="_blank" rel="noopener noreferrer">brunodiaz.dev</a></footer>
  <script type="module" src="/404.js"></script>
</body>
