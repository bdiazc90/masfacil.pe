<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El fondo de cada tema en hex (`--background` de styles.css): lo elige
       web/theme-boot.js antes de pintar y ui/theme.js al cambiar de tema. -->
  <meta name="theme-color" content="#f1f3f3" data-light="#f1f3f3" data-dark="#161b1d">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Compara precio y cercanía de gasolina, diésel, GLP y GNV en Lima provincia.">
  <title>masfacil.pe</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./tailwind.css">
  <link rel="stylesheet" href="./styles.css">
  <!-- Clásico y bloqueante: fija el tema y `theme-color` antes del primer
       pintado (web/theme-boot.js). -->
  <script src="/theme-boot.js"></script>
</head>
<body>
  <div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
  <a class="skip-link" href="#main">Ir al contenido</a>
  <!-- La aplicación es React (ui/main.jsx). El build pre-renderiza aquí la
       portada para que se vea antes de que cargue el JavaScript. -->
  <main id="main" tabindex="-1" class="app-shell"><!--portada--></main>
  <!-- Fuera de `main`: es el pie del documento, no parte del contenido. Aparece
       en todas las vistas porque vive fuera de los pasos que se ocultan. -->
  <footer class="firma">Hecho con amor para el Perú, por <a href="https://brunodiaz.dev" target="_blank" rel="noopener noreferrer">brunodiaz.dev</a></footer>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
